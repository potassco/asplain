site_name: asplain
site_url: https://mydomain.org/mysite
site_description: An Experimental Package Management Solution for Python
repo_name: potassco/asplain
repo_url: https://github.com/potassco/asplain
copyright: Copyright &copy; 2024 Potassco

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  logo: assets/images/potassco-logo.svg
  custom_dir: docs/overrides
  features:
    - header.autohide
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - content.code.annotate
    - toc.integrate
    - toc.follow
    - navigation.path
    # - navigation.top
    - navigation.tabs
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: custom #, [red, pink, purple, deep, purple, indigo, blue, light blue, cyan, teal, green, light green, lime, yellow, amber, orange, deep orange, brown, grey, blue, grey, black, white]
      accent: indigo # [red, pink, purple, deep, purple, indigo, blue, light, blue, cyan, teal, green, light, green, lime, yellow, amber, orange, deep orange]

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom #, [red, pink, purple, deep, purple, indigo, blue, light blue, cyan, teal, green, light green, lime, yellow, amber, orange, deep orange, brown, grey, blue, grey, black, white]
      accent: indigo # [red, pink, purple, deep, purple, indigo, blue, light, blue, cyan, teal, green, light, green, lime, yellow, amber, orange, deep orange]
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/potassco/asplain
    - icon: potassco-logo
      link: https://potassco.org

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - docs/overrides/.icons
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.snippets

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting_started.md
      - Usage: usage.md
  - Reference:
      - reference/index.md
      - API: reference/api.md
      - Encodings: reference/encodings.md
  - Examples:
      - examples/index.md
  - Community:
      - community/index.md
      # - Contributing: contributing.md
      # - Code of Conduct: code_of_conduct.md
      # - License: license.md
